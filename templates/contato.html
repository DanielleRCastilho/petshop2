{% extends "base.html" %}

{% block titulo %}Contato{% endblock %}

{% block conteudo %}
<section class="card">
    <div class="page-title">
        <h1>Contato</h1>
        <a class="button" href="{{ url_for('editar_contato') }}">
            Editar informações
        </a>
    </div>

    <div class="info-grid">
        <div class="info-card">
            <strong>Telefone</strong>
            {{ info.telefone }}
        </div>

        <div class="info-card">
            <strong>Email</strong>
            {{ info.email }}
        </div>

        <div class="info-card">
            <strong>Horário</strong>
            {{ info.horario }}
        </div>

        <div class="info-card">
            <strong>Endereço</strong>
            {{ info.endereco }}
        </div>
    </div>
</section>
{% endblock %}
