{% extends "base.html" %}
{% block titulo %}Pet{% endblock %}
{% block conteudo %}
<h2>{{ 'Editar pet' if pet else 'Novo pet' }}</h2>
{% if erro %}<p role="alert">{{ erro }}</p>{% endif %}
{% if donos %}
<form method="post">
<p><label>Nome: <input type="text" name="nome" value="{{ pet.nome if pet else '' }}" required></label></p>
<p><label>Raça: <input type="text" name="raca" value="{{ pet.raca or '' if pet else '' }}"></label></p>
<p><label>Dono:
<select name="dono_id" required>
           {% for d in donos %}
<option value="{{ d.id }}" {% if pet and pet.dono_id == d.id %}selected{% endif %}>{{ d.nome }}</option>
           {% endfor %}
</select>
</label></p>
<button type="submit">Salvar</button>
</form>
{% else %}
<p>Cadastre um dono antes: <a href="/donos/novo">Novo dono</a></p>
{% endif %}
{% endblock %}
