{% extends "base.html" %}

{% block titulo %}Detalhes do pet{% endblock %}

{% block conteudo %}
<section class="card">
    {% if pet %}
    <h1>{{ pet.nome }}</h1>

    <p><strong>Raça:</strong> {{ pet.raca or 'Não informada' }}</p>
    <p><strong>Dono:</strong> {{ pet.dono }}</p>

    <div class="actions">
        <a class="button"
           href="{{ url_for('editar_pet', id=pet.id) }}">Editar</a>

        <form method="post"
              action="{{ url_for('excluir_pet', id=pet.id) }}"
              onsubmit="return confirm('Excluir este pet?')">
            <button class="button-danger" type="submit">Excluir</button>
        </form>

        <a class="button button-secondary"
           href="{{ url_for('lista_pets') }}">Voltar</a>
    </div>
    {% else %}
    <h1>Pet não encontrado</h1>
    <a class="button" href="{{ url_for('lista_pets') }}">Voltar</a>
    {% endif %}
</section>
{% endblock %}
